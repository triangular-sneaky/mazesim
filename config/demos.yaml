# Movement bank — coordinated panel behaviours.
# Each movement names a generator (implemented in src/demos/player.js) that builds
# a timed action list from the live panel set, so it adapts to any layout.
# Generators: allTo | wave | ripple | mountain | sparkle | scatter | chase
#
# `group` organizes movements in the UI (with search). Groups appear in the order
# their first movement is listed here; add new movements with any `group:` to create
# more sections.
# NOTE: travel speed is global (set live in the UI) — movements no longer carry a
# per-movement velocity; timing/cascade comes from each generator's `interval`.
#
# A movement with `interactive: true` is driven live by a UI controller (registered
# in main.js by id) instead of a timeline generator — its row shows collapsible
# controls rather than a Play button.

demos:
  - id: all-up
    name: All up
    desc: raise every panel to a target height and turn all lights off
    group: Transition
    generator: allTo
    params: { position: 255, lightsOff: true }
    uiParams:
      - { key: position, label: height, min: 0, max: 255, step: 5 }

  - id: chase-top-1
    name: Pattern on top 1
    desc: diagonal chase into a symmetric two-height pattern — slow blinks while moving, then panels and lights hold static; auto-retriggered every period seconds
    group: Chase
    generator: chase
    params:
      duration: 10000
      topA: 255
      topB: 64
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: down panels, loKey: topB, hiKey: topA }

  - id: chase-top-2
    name: Pattern on top 2
    desc: scattered chase into random heights — panels settle at varied levels, slow blinks while moving, then lights hold; auto-retriggered every period seconds
    group: Chase
    generator: chase
    params:
      duration: 10000
      topA: 255
      topB: 64
      random: true
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: down panels, loKey: topB, hiKey: topA }

  - id: maze
    name: Maze
    desc: generates a navigatable maze — wall panels drop to low height (lit), passage panels rise (high, lit); new random maze each retrigger
    group: Chase
    generator: maze
    params:
      duration: 12000
      topA: 255
      topB: 64
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: walls (down), loKey: topB, hiKey: topA }

  - id: prison
    name: Prison
    desc: click a cell — its 4 edges cage the person, dropping and pulsing; click another to move the cage
    group: interlude
    interactive: true

  - id: wave-ns
    name: Wave (N→S)
    desc: rows rise then settle, north to south
    group: Demos
    generator: wave
    params: { axis: y, interval: 200, up: 255, down: 110 }

  - id: wave-we
    name: Wave (W→E)
    desc: columns rise then settle, west to east
    group: Demos
    generator: wave
    params: { axis: x, interval: 200, up: 255, down: 110 }

  - id: ripple
    name: Ripple
    desc: radial rise from the grid center
    group: Demos
    generator: ripple
    params: { interval: 110, up: 255, down: 120 }

  - id: mountain
    name: Mountain
    desc: static cone — peak at center, sloping to the edges
    group: Demos
    generator: mountain
    params: { peak: 255, base: 30 }

  - id: sparkle
    name: Sparkle
    desc: random LED blinks across the field
    group: Demos
    generator: sparkle
    params: { count: 80, interval: 110 }

  - id: scatter
    name: Scatter
    desc: random-ish panel movements and blinks
    group: Demos
    generator: scatter
    params: { duration: 8000, moves: 60, blinks: 40, minPos: 0, maxPos: 255 }

  - id: lullaby-drop
    name: Drop
    desc: field rests on the floor; center cell bounces — lit on descent, dark on ascent — each impact ripples a lift wave outward, lighting up at the crest
    group: Lullaby V
    generator: lullaby-drop
    params:
      floorPos: 0
      dropHeight: 200
      cycles: 6
      rippleInterval: 400
      rippleHeight: 0.05
    uiParams:
      - { key: dropHeight,     label: drop height,   min: 50,   max: 255,  step: 5    }
      - { key: cycles,         label: cycles,        min: 1,    max: 20,   step: 1    }
      - { key: rippleInterval, label: ripple ms/cell, min: 50,  max: 1200, step: 25   }
      - { key: rippleHeight,   label: wave height,   min: 0.01, max: 0.30, step: 0.01 }

  - id: all-down
    name: All down
    desc: lower every panel to the floor
    group: Demos
    generator: allTo
    params: { position: 0 }

  - id: rest
    name: Return to mid
    desc: send every panel to mid height
    group: Demos
    generator: allTo
    params: { position: 128 }
