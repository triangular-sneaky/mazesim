# Movement bank — coordinated panel behaviours.
# Each movement names a generator (implemented in src/demos/player.js) that builds
# a timed action list from the live panel set, so it adapts to any layout.
# Generators: allTo | wave | ripple | mountain | sparkle | scatter | chase | maze | lullaby-drop | particles
#
# `group` organizes movements in the UI (with search). Groups appear in the order
# their first movement is listed here; add new movements with any `group:` to create
# more sections.
# NOTE: travel speed is global (set live in the UI) — movements no longer carry a
# per-movement velocity; timing/cascade comes from each generator's `interval`.
#
# A movement with `interactive: true` is driven live by a UI controller (registered
# in main.js by id) instead of a timeline generator — its row shows collapsible
# controls rather than a Play button.
#
# `loop: true` means the movement re-triggers automatically when its last action fires
# (i.e. it loops until the user explicitly stops it).

demos:
  # ---- Transition -----------------------------------------------------------
  - id: all-up
    name: All up
    desc: raise every panel to a target height and turn all lights off
    group: Transition
    generator: allTo
    params: { position: 255, lightsOff: true }
    uiParams:
      - { key: position, label: height, min: 0, max: 255, step: 5 }

  # ---- Chase ----------------------------------------------------------------
  - id: chase-top-1
    name: Pattern on top 1
    desc: diagonal chase into a symmetric two-height pattern — slow blinks while moving, then panels and lights hold static; auto-retriggered every period seconds
    group: Chase
    generator: chase
    params:
      duration: 10000
      topA: 255
      topB: 64
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: down panels, loKey: topB, hiKey: topA }

  - id: chase-top-2
    name: Pattern on top 2
    desc: scattered chase into random heights — panels settle at varied levels, slow blinks while moving, then lights hold; auto-retriggered every period seconds
    group: Chase
    generator: chase
    params:
      duration: 10000
      topA: 255
      topB: 64
      random: true
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: down panels, loKey: topB, hiKey: topA }

  - id: maze
    name: Maze
    desc: generates a navigatable maze — wall panels drop to low height, passage panels rise; new random maze each retrigger
    group: Chase
    generator: maze
    params:
      duration: 12000
      topA: 255
      topB: 64
      period: 30
    uiParams:
      - { key: topA,   label: top high,  min: 64,  max: 255, step: 5 }
      - { key: topB,   label: top low,   min: 0,   max: 200, step: 5 }
      - { key: period, label: period (s), min: 2,  max: 120, step: 1 }
      - { key: _panel_map, type: panelMap, label: walls (down), loKey: topB, hiKey: topA }

  # ---- Lullaby V ------------------------------------------------------------
  - id: lullaby-drop
    name: Drop
    desc: field rests on the floor; center cell bounces — lit on descent, dark on ascent — each impact ripples a lift wave outward, looping until stopped
    group: Lullaby V
    generator: lullaby-drop
    params:
      floorPos: 0
      dropLo: 0
      dropHeight: 200
      rippleInterval: 400
      rippleHeight: 0.05
      rippleFadeout: 1.5
      loop: true
    uiParams:
      - { key: dropLo,         label: drop floor,     min: 0,    max: 200,  step: 5    }
      - { key: dropHeight,     label: drop peak,      min: 50,   max: 255,  step: 5    }
      - { key: rippleInterval, label: ripple ms/cell,  min: 50,   max: 5000, step: 25   }
      - { key: rippleHeight,   label: wave height,    min: 0.01, max: 0.30, step: 0.01 }
      - { key: rippleFadeout,  label: ripple fadeout, min: 0,    max: 5,    step: 0.1  }

  - id: particles
    name: Particles
    desc: N particles spiral through a static elastic structure, rippling each panel as they pass — spiral out from center or in from periphery
    group: Lullaby V
    generator: particles
    params:
      n: 2
      spiralIn: 0
      numTurns: 2
      structureHeight: 128
      elasticity: 0.9
      topPos: 255
      speed: 300
      rippleSize: 0.08
      rippleFadeout: 0.8
      oppose: 0
      fadeIn: 0
      loop: true
    uiParams:
      - { key: n,               label: particles,     min: 1,    max: 8,    step: 1    }
      - { key: spiralIn, label: spiral in, type: checkbox }
      - { key: oppose,  label: oppose,   type: checkbox }
      - { key: fadeIn,  label: fade in,  type: checkbox }
      - { key: structureHeight, label: center height, min: 0,    max: 255,  step: 5    }
      - { key: elasticity,      label: elasticity,    min: 0,    max: 1,    step: 0.05 }
      - { key: speed,           label: step ms,       min: 50,   max: 2000, step: 25   }
      - { key: rippleSize,      label: ripple size,   min: 0.01, max: 0.5,  step: 0.01 }
      - { key: rippleFadeout,   label: fadeout (s),   min: 0.1,  max: 5,    step: 0.1  }

  - id: lullaby-float
    name: Float
    desc: center cell bounces lo↔hi at global speed, always lit; surrounding panels elastically follow — closer = deeper pull, further = dimmer; brightness tracks position live
    group: Lullaby V
    interactive: true

  # ---- Flowie ------------------------------------------------------------
  - id: geo-corners
    name: Corners
    desc: four corner clusters lit at heights that match a perspective box view — back corners high, front corners low; all other panels up and dark
    group: Flowie
    generator: geo
    params: { shape: corners, restPos: 255 }
    uiParams:
      - { key: restPos, label: rest height, min: 0, max: 255, step: 5 }

  - id: geo-faces
    name: Faces
    desc: north wall lit high, south stepped wall lit low — two opposing box faces at different depths; all other panels up and dark
    group: Flowie
    generator: geo
    params: { shape: faces, restPos: 255 }
    uiParams:
      - { key: restPos, label: rest height, min: 0, max: 255, step: 5 }

  - id: geo-corner
    name: Corner
    desc: north wall high + west wall mid — two planes meeting at the NW joint, one lit box corner; all other panels up and dark
    group: Flowie
    generator: geo
    params: { shape: corner, restPos: 255 }
    uiParams:
      - { key: restPos, label: rest height, min: 0, max: 255, step: 5 }

  - id: geo-diagonal
    name: Diagonal
    desc: N wall up; W and E walls drape diagonally down north→south; the whole SE staircase cut sits on the floor — all lit, everything else off
    group: Flowie
    generator: geo
    params: { shape: diagonal, restPos: 255 }
    uiParams:
      - { key: restPos, label: rest height, min: 0, max: 255, step: 5 }

  # ---- Interlude ------------------------------------------------------------
  - id: prison
    name: Prison
    desc: click a cell — its 4 edges cage the person, dropping and pulsing; click another to move the cage
    group: interlude
    interactive: true

  # ---- Demos ----------------------------------------------------------------
  - id: wave-ns
    name: Wave (N→S)
    desc: rows rise then settle, north to south
    group: Demos
    generator: wave
    params: { axis: y, interval: 200, up: 255, down: 110 }

  - id: wave-we
    name: Wave (W→E)
    desc: columns rise then settle, west to east
    group: Demos
    generator: wave
    params: { axis: x, interval: 200, up: 255, down: 110 }

  - id: ripple
    name: Ripple
    desc: radial rise from the grid center
    group: Demos
    generator: ripple
    params: { interval: 110, up: 255, down: 120 }

  - id: mountain
    name: Mountain
    desc: static cone — peak at center, sloping to the edges
    group: Demos
    generator: mountain
    params: { peak: 255, base: 30 }

  - id: sparkle
    name: Sparkle
    desc: random LED blinks across the field
    group: Demos
    generator: sparkle
    params: { count: 80, interval: 110 }

  - id: scatter
    name: Scatter
    desc: random-ish panel movements and blinks
    group: Demos
    generator: scatter
    params: { duration: 8000, moves: 60, blinks: 40, minPos: 0, maxPos: 255 }

  - id: all-down
    name: All down
    desc: lower every panel to the floor
    group: Demos
    generator: allTo
    params: { position: 0 }

  - id: rest
    name: Return to mid
    desc: send every panel to mid height
    group: Demos
    generator: allTo
    params: { position: 128 }
